# Saros 前端 nginx：托管静态文件 + 反代 /api 到后端容器
# 阶段三切换 Java 后端：只需把两处 proxy_pass 的 backend:8000 换成新服务名，其余不动
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 大文件上传等场景的保守上限
    client_max_body_size 100m;

    # vue-router createWebHistory：深链接刷新回退 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → 后端容器（docker-compose 服务名 backend）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 流式接口（/qa/ask、/webpages 等）：必须关缓冲 + 长读超时，否则流式卡死
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 媒体文件（/api/media/*）：Range 头透传（FastAPI StaticFiles 原生支持，播放器可拖动）；
    # 更长的前缀优先匹配，自动覆盖上面 /api/ 的通用规则
    location /api/media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;          # 大视频流式转发，不落 nginx 磁盘
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}
